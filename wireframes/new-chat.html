<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdSpace New Chat Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbfaf5;
    --ink: #2a2a2a;
    --soft: #8b8780;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Patrick Hand", "Comic Sans MS", cursive;
    padding: 16px;
  }
  .sheet {
    max-width: 1600px;
    margin: 0 auto;
  }
  .caption {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 22px;
    margin: 0 4px 8px;
  }
  .caption small { font-size: 16px; color: var(--soft); }
  svg {
    display: block;
    width: 100%;
    height: auto;
  }
  svg text { font-family: "Patrick Hand", "Comic Sans MS", cursive; }
</style>
</head>
<body>
<div class="sheet">
  <div class="caption">
    <span>EdSpace · New chat (wireframe)</span>
    <small>lo-fi sketch · not to scale</small>
  </div>
  <svg id="wf" viewBox="0 0 2000 1150" role="img" aria-label="Hand-drawn wireframe of the EdSpace new chat screen"></svg>
</div>

<script src="vendor/rough.js"></script>
<script>
(function () {
  const svg = document.getElementById('wf');
  const NS = 'http://www.w3.org/2000/svg';
  const rc = rough.svg(svg);

  const INK = '#2a2a2a';
  const SOFT = '#8b8780';
  const FAINT = '#c9c4b8';
  const PAPER = '#fbfaf5';
  const PANEL = '#f3f1ea';

  // Fixed seeds keep the sketch identical on every load.
  let seed = 7;
  const o = (extra = {}) => Object.assign(
    { stroke: INK, strokeWidth: 1.6, roughness: 1.1, bowing: 1.2, seed: seed++ },
    extra
  );
  const add = (node) => { svg.appendChild(node); return node; };

  const rect = (x, y, w, h, opts) => add(rc.rectangle(x, y, w, h, o(opts)));
  const line = (x1, y1, x2, y2, opts) => add(rc.line(x1, y1, x2, y2, o(opts)));
  const circle = (cx, cy, d, opts) => add(rc.circle(cx, cy, d, o(opts)));
  const ellipse = (cx, cy, w, h, opts) => add(rc.ellipse(cx, cy, w, h, o(opts)));
  const path = (d, opts) => add(rc.path(d, o(opts)));
  const poly = (pts, opts) => add(rc.linearPath(pts, o(opts)));
  const rrect = (x, y, w, h, r, opts) => path(
    `M${x + r} ${y} H${x + w - r} Q${x + w} ${y} ${x + w} ${y + r} V${y + h - r} ` +
    `Q${x + w} ${y + h} ${x + w - r} ${y + h} H${x + r} Q${x} ${y + h} ${x} ${y + h - r} ` +
    `V${y + r} Q${x} ${y} ${x + r} ${y} Z`,
    opts
  );

  function text(x, y, str, { size = 19, fill = INK, anchor = 'start', weight = 400 } = {}) {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x);
    t.setAttribute('y', y);
    t.setAttribute('font-size', size);
    t.setAttribute('fill', fill);
    t.setAttribute('text-anchor', anchor);
    if (weight !== 400) t.setAttribute('font-weight', weight);
    t.textContent = str;
    return add(t);
  }

  // ---------- Icons (centered on cx, cy) ----------
  const thin = { strokeWidth: 1.4, roughness: 0.8 };
  const icon = {
    compose(cx, cy) {
      poly([[cx + 1, cy - 8], [cx - 8, cy - 8], [cx - 8, cy + 8], [cx + 8, cy + 8], [cx + 8, cy - 1]], thin);
      line(cx - 3, cy + 3, cx + 8, cy - 8, thin);
    },
    search(cx, cy) {
      circle(cx - 2, cy - 2, 13, thin);
      line(cx + 3, cy + 3, cx + 9, cy + 9, thin);
    },
    chevronUp(cx, cy) { poly([[cx - 6, cy + 3], [cx, cy - 3], [cx + 6, cy + 3]], thin); },
    chevronDown(cx, cy) { poly([[cx - 6, cy - 3], [cx, cy + 3], [cx + 6, cy - 3]], thin); },
    sidebar(cx, cy) {
      rrect(cx - 9, cy - 8, 18, 16, 4, thin);
      line(cx - 2, cy - 8, cx - 2, cy + 8, thin);
    },
    createAssistant(cx, cy) {
      rrect(cx - 9, cy - 8, 18, 15, 4, thin);
      line(cx - 4, cy + 7, cx - 6, cy + 11, thin);
      line(cx, cy - 4, cx, cy + 3, thin);
      line(cx - 3.5, cy - 0.5, cx + 3.5, cy - 0.5, thin);
    },
    joinCode(cx, cy) {
      rrect(cx - 9, cy - 8, 18, 15, 4, thin);
      line(cx - 4, cy + 7, cx - 6, cy + 11, thin);
      circle(cx, cy - 1, 7, thin);
    },
    bot(cx, cy) {
      circle(cx, cy, 26, { ...thin, stroke: SOFT });
      rrect(cx - 6, cy - 4, 12, 9, 2, thin);
      line(cx, cy - 4, cx, cy - 7, thin);
    },
    avatar(cx, cy) {
      circle(cx, cy, 26, { ...thin, fill: '#9d988d', fillStyle: 'cross-hatch', hachureGap: 4, fillWeight: 0.8 });
    },
    newFolder(cx, cy) {
      path(`M${cx - 9} ${cy - 7} H${cx - 3} L${cx - 1} ${cy - 4} H${cx + 9} V${cy + 7} H${cx - 9} Z`, thin);
      line(cx + 7, cy - 1, cx + 13, cy - 1, thin);
      line(cx + 10, cy - 4, cx + 10, cy + 2, thin);
    },
    gear(cx, cy) {
      circle(cx, cy, 17, thin);
      circle(cx, cy, 6, thin);
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i;
        line(cx + Math.cos(a) * 8.5, cy + Math.sin(a) * 8.5, cx + Math.cos(a) * 11, cy + Math.sin(a) * 11, thin);
      }
    },
    feedback(cx, cy) {
      rrect(cx - 9, cy - 8, 18, 14, 4, thin);
      line(cx - 4, cy + 6, cx - 7, cy + 10, thin);
      line(cx - 4, cy - 2, cx + 4, cy - 2, thin);
      line(cx - 4, cy + 2, cx + 2, cy + 2, thin);
    },
    lifebuoy(cx, cy) {
      circle(cx, cy, 19, thin);
      circle(cx, cy, 8, thin);
    },
    paperclip(cx, cy) {
      path(`M${cx + 4} ${cy - 3} V${cy + 5} Q${cx + 4} ${cy + 9} ${cx} ${cy + 9} Q${cx - 4} ${cy + 9} ${cx - 4} ${cy + 5} ` +
           `V${cy - 6} Q${cx - 4} ${cy - 9} ${cx - 1} ${cy - 9} Q${cx + 1} ${cy - 9} ${cx + 1} ${cy - 6} V${cy + 4}`, thin);
    },
    globe(cx, cy) {
      circle(cx, cy, 18, thin);
      ellipse(cx, cy, 8, 18, thin);
      line(cx - 9, cy, cx + 9, cy, thin);
    },
    image(cx, cy) {
      rrect(cx - 9, cy - 8, 18, 16, 3, thin);
      poly([[cx - 9, cy + 6], [cx - 3, cy], [cx + 1, cy + 3], [cx + 4, cy], [cx + 9, cy + 5]], thin);
      circle(cx + 4, cy - 4, 3, thin);
    },
    folder(cx, cy) {
      path(`M${cx - 9} ${cy - 7} H${cx - 3} L${cx - 1} ${cy - 4} H${cx + 9} V${cy + 7} H${cx - 9} Z`, thin);
    },
    mic(cx, cy) {
      rrect(cx - 4, cy - 10, 8, 13, 4, thin);
      path(`M${cx - 7} ${cy} Q${cx - 7} ${cy + 7} ${cx} ${cy + 7} Q${cx + 7} ${cy + 7} ${cx + 7} ${cy}`, thin);
      line(cx, cy + 7, cx, cy + 11, thin);
    },
  };

  // ---------- Paper & frame ----------
  const bg = document.createElementNS(NS, 'rect');
  bg.setAttribute('width', 2000);
  bg.setAttribute('height', 1150);
  bg.setAttribute('fill', PAPER);
  add(bg);

  // ---------- Sidebar ----------
  rrect(10, 10, 36, 36, 8, { fill: '#d6d2c8', fillStyle: 'hachure', hachureGap: 5, fillWeight: 1 });
  text(28, 34, 'S', { anchor: 'middle', size: 20 });
  text(56, 25, 'Studio Scale', { size: 20 });
  text(56, 45, 'School admin', { size: 16, fill: SOFT });
  icon.sidebar(270, 28);

  // New chat (selected)
  rrect(10, 66, 277, 36, 10, { fill: '#cfcac0', fillStyle: 'hachure', hachureGap: 7, fillWeight: 0.9, hachureAngle: -50 });
  icon.compose(28, 84);
  text(46, 90, 'New chat');

  icon.search(28, 121);
  text(46, 127, 'Search');

  // Assistants
  icon.chevronUp(28, 158);
  text(46, 164, 'Assistants');
  line(30, 180, 30, 342, { stroke: FAINT, strokeWidth: 1.4 });
  icon.createAssistant(60, 200);
  text(78, 206, 'Create assistant');
  icon.joinCode(60, 241);
  text(78, 247, 'Join with code');
  icon.bot(60, 283);
  text(78, 289, 'English grammar coach');
  icon.avatar(60, 324);
  text(78, 330, 'Studio Scale');

  // Folders
  icon.chevronUp(28, 366);
  text(46, 372, 'Folders');
  line(30, 384, 30, 466, { stroke: FAINT, strokeWidth: 1.4 });
  icon.newFolder(60, 403);
  text(78, 409, 'New folder');
  text(46, 441, 'Collect chats into folders to find them', { size: 15, fill: SOFT });
  text(46, 459, 'faster.', { size: 15, fill: SOFT });

  // Latest
  icon.chevronUp(28, 487);
  text(46, 493, 'Latest');
  line(30, 505, 30, 836, { stroke: FAINT, strokeWidth: 1.4 });
  [
    'Friendly Greeting and Assistance',
    'Informal greeting',
    'Conversation in Danish',
    'Tone of voice review',
    'Short hello and feedback',
    'Image request details',
    'Assistant share code 185376',
    '6-digit assistant code',
    'Incorrect or incomplete code',
  ].forEach((label, i) => text(46, 530 + i * 37, label));

  // Footer
  line(0, 971, 296, 971, { strokeWidth: 1.3 });
  icon.gear(28, 1001);
  text(46, 1007, 'Organization settings');
  icon.feedback(28, 1043);
  text(46, 1049, 'Feedback');
  icon.lifebuoy(28, 1085);
  text(46, 1091, 'Support');
  rrect(10, 1108, 36, 36, 8, { fill: '#d6d2c8', fillStyle: 'hachure', hachureGap: 5, fillWeight: 1 });
  text(28, 1132, 'S', { anchor: 'middle', size: 20 });
  text(56, 1132, 'sevgi@studioscale.co', { size: 19 });

  // ---------- Main panel ----------
  rrect(306, 10, 1684, 1133, 22, { fill: PANEL, fillStyle: 'solid', strokeWidth: 2 });

  // Dotted canvas texture (jittered, like pencil dots)
  const dots = document.createElementNS(NS, 'g');
  dots.setAttribute('fill', FAINT);
  let r = 12345;
  const rnd = () => ((r = (r * 16807) % 2147483647) / 2147483647) - 0.5;
  for (let y = 100; y < 1130; y += 34) {
    for (let x = 330; x < 1975; x += 34) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', (x + rnd() * 4).toFixed(1));
      c.setAttribute('cy', (y + rnd() * 4).toFixed(1));
      c.setAttribute('r', (1.3 + rnd()).toFixed(2));
      dots.appendChild(c);
    }
  }
  add(dots);

  // Header
  line(306, 74, 1990, 74, { strokeWidth: 1.3 });
  text(1916, 48, 'School prompt', { anchor: 'end', size: 20 });
  rrect(1930, 29, 44, 24, 12, { fill: '#7d786e', fillStyle: 'hachure', hachureGap: 4, fillWeight: 1 });
  circle(1961, 41, 17, { fill: PAPER, fillStyle: 'solid' });

  // Chat / Assistants segmented control
  rrect(1036, 328, 224, 42, 12, { fill: '#e6e2d8', fillStyle: 'solid' });
  rrect(1041, 333, 88, 32, 9, { fill: '#ffffff', fillStyle: 'solid' });
  text(1085, 356, 'Chat', { anchor: 'middle' });
  text(1193, 356, 'Assistants', { anchor: 'middle', fill: SOFT });

  // Heading
  text(1148, 476, 'What would you like to ask?', { anchor: 'middle', size: 50 });
  // A loose underline scribble under the heading
  path('M960 492 Q1150 484 1336 494', { stroke: SOFT, strokeWidth: 1.2, roughness: 1.6 });

  // Composer
  rrect(788, 562, 720, 110, 16, { fill: '#ffffff', fillStyle: 'solid', strokeWidth: 2 });
  text(803, 594, 'Spørg om hvad som helst...', { fill: SOFT });
  line(802, 602, 1080, 602, { stroke: FAINT, strokeWidth: 1, roughness: 1.5 });

  icon.paperclip(818, 643);
  icon.globe(864, 643);
  icon.image(910, 643);
  icon.folder(957, 643);

  text(1324, 650, 'GPT-5.6 Terra', { size: 17, fill: SOFT, anchor: 'end' });
  text(1332, 650, 'Auto', { size: 18 });
  icon.chevronDown(1374, 643);
  icon.mic(1427, 642);

  rrect(1457, 622, 42, 42, 9, { fill: '#8f8a80', fillStyle: 'hachure', hachureGap: 4, fillWeight: 1 });
  line(1478, 654, 1478, 632, { stroke: INK, strokeWidth: 2 });
  poly([[1470, 640], [1478, 631], [1486, 640]], { stroke: INK, strokeWidth: 2 });

  text(1148, 698, 'EdSpace Chat can be wrong. Use your professional judgment and verify important information.',
       { anchor: 'middle', size: 15, fill: SOFT });
})();
</script>
</body>
</html>
